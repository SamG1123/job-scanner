<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find India-based jobs, save opportunities, and prepare tailored applications.">
<title>India Job Scout</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/" aria-label="Job Scout home"><span class="brand-mark">J</span><span><span class="brand-title">Job Scout India</span><span class="brand-subtitle">India hiring, all in one place</span></span></a>
  <nav class="nav" aria-label="Main navigation">
    <a href="/" aria-current="page">Jobs</a><a href="/all-jobs.html">Browse all</a><a href="/portals.html">Job portals</a><a href="/saved.html">Saved</a><a href="/profile.html">Profile</a><a href="/applications.html">Application tools</a>
  </nav>
</div></header>
<main>
  <header class="page-head"><h1>Find your next role in India</h1><p>Recent openings at companies hiring in India. Remote listings are included only when the role is open to India-based candidates.</p></header>
  <section class="panel" aria-label="India job search">
    <div class="panel-body">
      <label for="q">Search jobs</label>
      <div class="search-row"><input id="q" type="search" placeholder="Role, company, or keyword" autocomplete="off"></div>
      <div class="form-grid" aria-label="Job filters">
        <div><label for="mode">Work arrangement</label><select id="mode"><option value="all">All India-based roles</option><option value="onsite">On-site</option><option value="hybrid">Hybrid</option><option value="remote">Remote within India</option></select></div>
        <div class="filter-check"><label><input type="checkbox" id="it"> Intern / entry-level</label></div>
      </div>
      <p class="status" id="job-count" aria-live="polite">Loading India jobs…</p>
      <div id="jobs" aria-live="polite"></div>
    </div>
  </section>
</main>
<script src="/app.js"></script>
<script>
const $=id=>document.getElementById(id);
let generation=0,timer;
async function loadJobs(){
  const current=++generation;
  $("job-count").textContent="Loading jobs…";
  $("jobs").innerHTML="";
  const params=new URLSearchParams({
    q:$("q").value.trim(),
    mode:$("mode").value,
    intern:String(+$("it").checked),
  });
  try{
    const jobs=await JobScout.api(`/api/jobs?${params}`);
    if(current!==generation)return;
    $("job-count").textContent=`${jobs.length} ${jobs.length===1?"job":"jobs"}${jobs.length===200?" · Showing the latest 200":""}`;
    $("jobs").innerHTML=jobs.map(job=>JobScout.jobCard(job)).join("")||'<div class="empty">No matching India-based jobs found. Try changing your search or filters.</div>';
  }catch(error){
    if(current!==generation)return;
    $("job-count").textContent=error.message;
    $("job-count").classList.add("error");
  }
}
$("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(loadJobs,250)});
["mode","it"].forEach(id=>$(id).addEventListener("change",loadJobs));
loadJobs();
</script>
</body>
</html>
