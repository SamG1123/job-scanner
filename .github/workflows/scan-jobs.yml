name: scan-jobs
on:
  schedule:
    - cron: "47 0,6,12,18 * * *" # 00:17, 06:17, 12:17, and 18:17 IST
  workflow_dispatch:          # "Run workflow" button for manual scans
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pymongo
      - run: python scan.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}   # optional, defaults to onboarding@resend.dev
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
