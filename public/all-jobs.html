<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All jobs · Job Scout</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;font-synthesis:none;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e6eaf0}
.topbar-inner{max-width:1000px;margin:auto;padding:1.2rem 2rem;display:flex;align-items:center;gap:.8rem}
.brand-mark{width:2.4rem;height:2.4rem;border-radius:.75rem;background:#eaf1ff;color:#2459c4;display:grid;place-items:center;font-weight:800}
.brand-title{margin:0;font-size:1.05rem;letter-spacing:-.02em}
.brand-subtitle{margin:.15rem 0 0;color:#778197;font-size:.82rem}
a{color:#315fba;text-decoration:none;font-size:.86rem;font-weight:600}
a:hover{text-decoration:underline}
.back-link{margin-left:auto}
main{max-width:1000px;margin:0 auto;padding:2rem}
.panel{background:#fff;border:1px solid #e6eaf0;border-radius:1rem;box-shadow:0 2px 8px #17203308}
.panel-head{padding:1.4rem;border-bottom:1px solid #edf0f4}
.panel-head h2{margin:0;font-size:1.15rem;letter-spacing:-.02em}
.panel-head p{margin:.35rem 0 0;color:#778197;font-size:.88rem}
.panel-body{padding:1.25rem 1.4rem}
.search{position:relative}
.search:before{content:"⌕";position:absolute;left:.85rem;top:.35rem;color:#8792a5;font-size:1.35rem}
input{width:100%;font:inherit;font-size:.9rem;color:#172033;background:#fff;border:1px solid #dce2eb;border-radius:.65rem;padding:.7rem .8rem .7rem 2.5rem;outline:none}
input:focus{border-color:#6b91e8;box-shadow:0 0 0 3px #356fe51c}
input::placeholder{color:#98a1b1}
.result-label{font-size:.82rem;color:#778197;margin:1rem 0 .7rem}
#jobs{display:grid;gap:.65rem}
.job{padding:1rem;border:1px solid #e6eaf0;border-radius:.8rem;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:#cbd6e8;box-shadow:0 3px 12px #1720330b}
.job-title{margin:0;font-size:.96rem;font-weight:650;line-height:1.4}
.job-company{margin:.3rem 0;color:#596579;font-size:.86rem}
.job-date{color:#8792a5;font-size:.77rem}
.job-actions{margin-top:.75rem}
button{font:inherit;cursor:pointer;border:0}
.button-secondary{display:block;margin:1rem auto 0;background:#edf3ff;color:#315fba;border-radius:.55rem;padding:.7rem 1rem;font-size:.87rem;font-weight:600}
.button-secondary[hidden]{display:none}
.button-secondary:hover{background:#e2ecff}
.button-secondary:disabled{opacity:.55;cursor:wait}
.empty,.error{padding:2rem 1rem;text-align:center;border:1px dashed #dce2eb;border-radius:.8rem;color:#778197;font-size:.88rem}
.error{color:#a33b3b;background:#fffafa;border-color:#efcccc}
@media(max-width:600px){main{padding:1rem}.topbar-inner{padding:1rem}.panel-head,.panel-body{padding:1rem}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand-mark">J</div><div><h1 class="brand-title">Job Scout</h1><p class="brand-subtitle">Find your next opportunity</p></div><a class="back-link" href="/">← Back to dashboard</a></div></header>
<main>
<section class="panel">
<div class="panel-head"><h2>All job openings</h2><p>Browse every available India-based onsite/hybrid role and remote role worldwide.</p></div>
<div class="panel-body">
<div class="search"><input id="q" placeholder="Search by title, company, or keyword" aria-label="Search all jobs"></div>
<p class="result-label" id="job-count" aria-live="polite">Loading jobs…</p>
<div id="jobs"></div>
<button id="more" class="button-secondary" type="button" hidden onclick="loadMore()">Load more jobs</button>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async u=>{const pw=localStorage.pw||(localStorage.pw=prompt('Password'));
 const r=await fetch(u,{headers:{'x-pass':pw,'Content-Type':'application/json'}});
 if(r.status===401){delete localStorage.pw;throw new Error('Wrong password. Reload the page and try again.')}
 if(!r.ok)throw new Error(`Request failed (${r.status})`);
 return r.json()};
let loaded=0,generation=0,moreAvailable=false,timer;
async function load(reset=true){
 if(reset){generation++;loaded=0;$('jobs').innerHTML='';$('more').hidden=true}
 const current=generation;
 $('job-count').textContent=reset?'Loading jobs…':`Loading more jobs…`;
 $('more').disabled=true;
 try{
  const q=encodeURIComponent($('q').value.trim());
  const batch=await api(`/api/jobs?all=1&skip=${loaded}&q=${q}`);
  if(current!==generation)return;
  $('jobs').insertAdjacentHTML('beforeend',batch.map(j=>`<article class="job"><h3 class="job-title">${e(j.title)}</h3><p class="job-company">${e(j.company)} · ${e(j.location)}</p>
   <small class="job-date">First seen ${new Date(j.seen*1000).toLocaleDateString()}</small>
   <div class="job-actions"><a href="${e(j.url)}" target="_blank" rel="noopener noreferrer">View opening ↗</a></div></article>`).join(''));
  loaded+=batch.length;moreAvailable=batch.length===200;
  $('job-count').textContent=`Showing ${loaded} ${loaded===1?'job':'jobs'}${moreAvailable?'':' · End of results'}`;
  if(loaded===0)$('jobs').innerHTML='<div class="empty">No jobs found. Try another search.</div>';
  $('more').hidden=!moreAvailable;
 }catch(err){
  if(current!==generation)return;
  $('job-count').textContent='Could not load jobs';
  $('jobs').innerHTML=`<div class="error">${e(err.message)}</div>`;
  $('more').hidden=true;
 }finally{
  if(current===generation)$('more').disabled=false;
 }
}
function loadMore(){if(moreAvailable)load(false)}
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load(),250)});
load();
</script>
</body>
</html>
