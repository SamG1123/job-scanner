<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All India jobs · Job Scout</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><span class="brand-mark">J</span><span><span class="brand-title">Job Scout India</span><span class="brand-subtitle">India hiring, all in one place</span></span></a>
  <nav class="nav" aria-label="Main navigation"><a href="/">Jobs</a><a href="/all-jobs.html" aria-current="page">Browse all</a><a href="/portals.html">Job portals</a><a href="/saved.html">Saved</a><a href="/profile.html">Profile</a><a href="/applications.html">Application tools</a></nav>
</div></header>
<main>
  <header class="page-head"><h1>All India openings</h1><p>Search every recent India-based listing in your board. Roles abroad are excluded, including remote roles that do not specify India hiring.</p></header>
  <section class="panel"><div class="panel-body">
    <label for="q">Search jobs</label><div class="search-row"><input id="q" type="search" placeholder="Role, company, or keyword" autocomplete="off"></div>
    <p class="status" id="job-count" aria-live="polite">Loading jobs…</p><div id="jobs" aria-live="polite"></div>
    <button class="secondary" id="more" type="button" hidden>Load more</button>
  </div></section>
</main>
<script src="/app.js"></script>
<script>
const $=id=>document.getElementById(id);
let loaded=0,generation=0,moreAvailable=false,timer;
async function load(reset=true){
  if(reset){generation++;loaded=0;$("jobs").innerHTML="";$("more").hidden=true;}
  const current=generation;
  $("job-count").textContent=reset?"Loading jobs…":"Loading more jobs…";
  $("more").disabled=true;
  try{
    const params=new URLSearchParams({all:"1",skip:String(loaded),q:$("q").value.trim()});
    const batch=await JobScout.api(`/api/jobs?${params}`);
    if(current!==generation)return;
    $("jobs").insertAdjacentHTML("beforeend",batch.map(job=>JobScout.jobCard(job)).join(""));
    loaded+=batch.length;
    moreAvailable=batch.length===200;
    $("job-count").textContent=`Showing ${loaded} ${loaded===1?"job":"jobs"}${moreAvailable?"":" · End of results"}`;
    if(!loaded)$("jobs").innerHTML='<div class="empty">No India-based jobs found. Try another search.</div>';
    $("more").hidden=!moreAvailable;
  }catch(error){
    if(current!==generation)return;
    $("job-count").textContent=error.message;
    $("job-count").classList.add("error");
  }finally{if(current===generation)$("more").disabled=false;}
}
$("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>load(),250)});
$("more").addEventListener("click",()=>{if(moreAvailable)load(false)});
load();
</script>
</body>
</html>
